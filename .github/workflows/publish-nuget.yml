name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Opcjonalna wersja (nadpisuje wersję z Directory.Build.props). Zostaw puste, aby użyć wersji z props.'
        required: false
        type: string
      publish:
        description: 'Opublikuj pakiety na nuget.org'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ARTIFACTS_DIR: ./artifacts

jobs:
  build-and-publish:
    name: Build & Publish NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Wymagane dla NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: dotnet test --no-build -c Release --logger "console;verbosity=minimal"

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "Version override from input: ${{ github.event.inputs.version }}"
          else
            # Odczytaj wersję z Directory.Build.props
            VER=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1 || true)
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "Version from Directory.Build.props: $VER"
          fi

      - name: Pack NuGet packages
        # Pack only projects under src/ — always skip samples/ (e.g. Sample.Plugins),
        # which is packable for local demo but must never be published to nuget.org.
        run: |
          PACK_VERSION="${{ steps.version.outputs.version }}"
          PACK_ARGS=(--no-build -c Release -o "${{ env.ARTIFACTS_DIR }}" /p:ContinuousIntegrationBuild=true)
          if [ -n "$PACK_VERSION" ]; then
            PACK_ARGS+=(/p:Version="$PACK_VERSION")
          fi

          shopt -s nullglob
          projects=(src/*/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No projects found under src/"
            exit 1
          fi

          for proj in "${projects[@]}"; do
            echo "Packing $proj"
            dotnet pack "$proj" "${PACK_ARGS[@]}"
          done

          # Safety net: never ship sample packages even if a path changes later
          rm -f "${{ env.ARTIFACTS_DIR }}"/Sample.Plugins*.nupkg \
                "${{ env.ARTIFACTS_DIR }}"/Sample.Plugins*.snupkg

      - name: List generated packages
        run: ls -la ${{ env.ARTIFACTS_DIR }}/

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.ARTIFACTS_DIR }}/
          retention-days: 30

      # OIDC JWT must be exchanged for a short-lived NuGet API key (NuGet/login).
      # Raw GitHub OIDC tokens are NOT valid --api-key values (→ 403).
      # continue-on-error: allow classic secrets.NUGET_API_KEY if OIDC policy is not ready.
      #
      # user = nuget.org username of the Trusted Publishing *policy creator*
      # (usually package owner). Must match account that created the policy —
      # NOT the GitHub org/user unless that is also the nuget.org login.
      # Packages PluginRegistration.* are owned by nuget.org user "psobczak".
      - name: NuGet login (OIDC → temp API key)
        if: (github.event_name == 'release') || (github.event.inputs.publish == 'true')
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          # nuget.org profile (NOT email, NOT necessarily GitHub login).
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER || 'psobczak' }}

      - name: Publish to NuGet.org
        if: (github.event_name == 'release') || (github.event.inputs.publish == 'true')
        id: publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
          LOGIN_OUTCOME: ${{ steps.nuget-login.outcome }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Brak klucza NuGet (OIDC login outcome=$LOGIN_OUTCOME, brak secret NUGET_API_KEY)."
            echo "1) Zaloguj się na nuget.org jako właściciel pakietów (psobczak) → Trusted Publishing"
            echo "   GitHub owner: crstPawel, repo: PluginRegistration, workflow: publish-nuget.yml, env: (empty)"
            echo "2) NuGet/login user = twórca polityki (psobczak), NIE GitHub login (crstPawel)"
            echo "3) Albo dodaj klasyczny secret NUGET_API_KEY z uprawnieniem Push"
            exit 1
          fi

          if [ -n "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" ]; then
            echo "Pushing packages with Trusted Publishing (temp API key)..."
          else
            echo "Pushing packages with classic NUGET_API_KEY secret (OIDC login outcome=$LOGIN_OUTCOME)..."
          fi

          # Push only .nupkg; symbols (.snupkg) are associated during pack and uploaded with the package
          dotnet nuget push "${{ env.ARTIFACTS_DIR }}/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish summary
        if: always() && ((github.event_name == 'release') || (github.event.inputs.publish == 'true'))
        run: |
          OUTCOME="${{ steps.publish.outcome }}"
          LOGIN="${{ steps.nuget-login.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            echo "✅ Pakiety NuGet zostały opublikowane na nuget.org" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "OIDC login: \`$LOGIN\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Opublikowane pakiety:" >> $GITHUB_STEP_SUMMARY
            ls ${{ env.ARTIFACTS_DIR }}/*.nupkg 2>/dev/null | xargs -I {} basename {} | sed 's/^/- \`/' | sed 's/$/\`/' >> $GITHUB_STEP_SUMMARY || echo "- (brak plików)" >> $GITHUB_STEP_SUMMARY
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "⚠️ Publish pominięty" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish na nuget.org nie powiódł się (publish: $OUTCOME, OIDC login: $LOGIN)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Sprawdź: Trusted Publishing pod kontem **psobczak** (policy creator), GitHub \`crstPawel/PluginRegistration\` + \`publish-nuget.yml\`, opcjonalnie \`NUGET_API_KEY\`." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
